name: Docker Build, Test and Push

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build app image
        run: docker build -f Dockerfile.app -t ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-app:latest .

      - name: Run tests
        run: |
          docker run --name test-app ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-app:latest
          TEST_EXIT_CODE=$(docker inspect test-app --format='{{.State.ExitCode}}')
          docker rm test-app
          if [ $TEST_EXIT_CODE -ne 0 ]; then exit 1; fi

      - name: Build web image
        run: docker build -f Dockerfile.web -t ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-web:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-web:latest
